<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美食口袋名單</title>

    <!-- 瀏覽器網址列/工作列的主題色，跟網站主色一致 -->
    <meta name="theme-color" content="#f2762e" id="themeColorMeta">

    <!-- 在畫面渲染前，先套用使用者上次選擇的風格色調，避免畫面先閃一下預設色再切換 -->
    <script>
        (function(){
            try {
                var savedTheme = localStorage.getItem("foodAppTheme");
                if(savedTheme){
                    document.documentElement.setAttribute("data-theme", savedTheme);
                }
            } catch(e){ /* 無痕模式或瀏覽器封鎖 localStorage 時，安靜地忽略，改用預設風格 */ }
        })();
    </script>

    <!-- Google Font：中文維持 Noto Sans TC；Fredoka 給英文字母/數字用，活潑一點；
         LXGW WenKai TC 是給店家卡片備註欄專用的手寫感字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;500;600;700;900&family=Fredoka:wght@400;500;600;700&family=LXGW+WenKai+TC&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons：簡約線條圖示，取代原本部分功能按鈕用的 emoji（編輯／刪除／星號／搜尋等），
         用 currentColor 上色，會自動跟著每個按鈕原本的顏色走 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">

    <!-- Leaflet 地圖套件（免費、不需要 API 金鑰） -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- apiFunction.js 已依功能拆分成下列小檔案，依相依順序載入 -->
    <script src="js/api.js" defer></script>
    <script src="js/state.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/theme.js" defer></script>
    <script src="js/filters.js" defer></script>
    <script src="js/cursor-effects.js" defer></script>
    <script src="js/favorites.js" defer></script>
    <script src="js/food-crud.js" defer></script>
    <script src="js/corner-glow.js" defer></script>
    <script src="js/map.js" defer></script>
    <script src="js/share.js" defer></script>
    <script src="js/sticky-form.js" defer></script>
    <script src="js/mobile-nav.js" defer></script>
    <script src="js/main.js" defer></script>

    <!-- 電腦瀏覽器 favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

    <!-- 舊瀏覽器支援 -->
    <link rel="shortcut icon" href="favicon.ico">

    <!-- iPhone / iPad 加入主畫面 -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Android Chrome -->
    <link rel="icon" type="image/png" sizes="192x192" href="android-icon-192.png">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <!-- 全螢幕開場過場動畫，需放在最前面、不可加 defer/async，
         這樣才能在畫面內容渲染出來前就先蓋住整個頁面並鎖住捲動 -->
    <script src="js/introAnimation.js"></script>

    <!-- 主畫面元素登場動畫：同樣不可加 defer/async，且需放在 introAnimation.js
         之後、其餘畫面內容之前，這樣才能在內容渲染前先設好初始隱藏狀態，
         並在開場遮罩淡出的同一時機讓內容活潑地依序彈出。 -->
    <script src="js/entranceAnimation.js"></script>

    <!-- ====================== 背景飄浮美食 emoji ====================== -->
    <div class="food-bg" aria-hidden="true">
        <span style="left:4%; font-size:75px; animation-duration:22s; animation-delay:-3s; --drift:24px; --rotate:14deg; --emoji-opacity:.24;">🍜</span>
        <span style="left:15%; font-size:56px; animation-duration:18s; animation-delay:-15s; --drift:-18px; --rotate:-10deg; --emoji-opacity:.26;">🍣</span>
        <span style="left:26%; font-size:70px; animation-duration:26s; animation-delay:-8s; --drift:16px; --rotate:8deg; --emoji-opacity:.22;">🍕</span>
        <span style="left:38%; font-size:65px; animation-duration:20s; animation-delay:-17s; --drift:-22px; --rotate:12deg; --emoji-opacity:.25;">🍔</span>
        <span style="left:50%; font-size:52px; animation-duration:16s; animation-delay:-6s; --drift:14px; --rotate:-8deg; --emoji-opacity:.28;">🍰</span>
        <span style="left:61%; font-size:70px; animation-duration:24s; animation-delay:-20s; --drift:-20px; --rotate:10deg; --emoji-opacity:.23;">🍩</span>
        <span style="left:72%; font-size:82px; animation-duration:19s; animation-delay:-11s; --drift:18px; --rotate:-14deg; --emoji-opacity:.26;">🍤</span>
        <span style="left:82%; font-size:58px; animation-duration:23s; animation-delay:-19s; --drift:-16px; --rotate:9deg; --emoji-opacity:.24;">🥐</span>
        <span style="left:91%; font-size:61px; animation-duration:17s; animation-delay:-4s; --drift:20px; --rotate:-11deg; --emoji-opacity:.27;">🍎</span>
        <span style="left:8%; font-size:65px; animation-duration:15s; animation-delay:-9s; --drift:-14px; --rotate:15deg; --emoji-opacity:.25;">🍇</span>
        <span style="left:45%; font-size:80px; animation-duration:21s; animation-delay:-2s; --drift:12px; --rotate:-9deg; --emoji-opacity:.24;">🍙</span>
        <span style="left:68%; font-size:53px; animation-duration:27s; animation-delay:-23s; --drift:-24px; --rotate:13deg; --emoji-opacity:.22;">🧋</span>
    </div>

    <div class="app">
        <header class="header">
            <div class="brand">
                <div class="logo">
                    <img src="logo.png" alt="logo">
                </div>
                <div>
                    <h1>美食口袋名單</h1>
                    <p>收藏你的美味回憶</p>
                </div>
            </div>
            <div class="count-box">
                <span id="foodCount">0</span>
                <small>間餐廳</small>
            </div>
        </header>

        <div class="search-area">
            <div class="search-box">
                <span><i class="bi bi-search"></i></span>
                <input id="searchInp" type="text" placeholder="搜尋店名、類型、地址..." oninput="filterFood()">
            </div>
            <button id="favFilterBtn" class="fav-filter-btn" onclick="toggleFavFilter()">
                <i class="bi bi-star-fill"></i> 只看最愛
            </button>
            <button id="mapViewBtn" class="fav-filter-btn map-view-btn" onclick="openMapView()" disabled title="店家定位中，請稍候...">
                <i class="bi bi-map-fill"></i> 地圖檢視
            </button>
        </div>

        <div class="sort-bar">
            <span class="sort-bar-label"><i class="bi bi-sort-down"></i> 排序</span>
            <div class="select-wrap sort-select-wrap">
                <select id="sortSelect" onchange="setSortOrder(this.value)">
                    <option value="name">店名</option>
                    <option value="ratingDesc">評價高→低</option>
                    <option value="ratingAsc">評價低→高</option>
                    <option value="updatedDesc" selected>最近更新（新→舊）</option>
                    <option value="updatedAsc">最近更新（舊→新）</option>
                    <option value="region">地區</option>
                </select>
            </div>
        </div>

        <div id="regionFilterBar" class="region-filter-bar"></div>

        <div id="typeFilterBar" class="region-filter-bar type-filter-bar"></div>

        <!-- 色票排序依色相環排列（暖 → 冷 → 中性），視覺上是一段連續漸變而非跳來跳去 -->
        <div class="theme-picker-bar" role="group" aria-label="選擇風格色調">
            <span class="theme-picker-label"><i class="bi bi-palette-fill"></i> 風格</span>
            <button class="theme-swatch" data-theme="rouge" title="胭脂紅豔" aria-label="胭脂紅豔" onclick="setTheme('rouge')"></button>
            <button class="theme-swatch" data-theme="sunset" title="夕陽楓紅" aria-label="夕陽楓紅" onclick="setTheme('sunset')"></button>
            <button class="theme-swatch" data-theme="honey" title="蜂蜜黃調" aria-label="蜂蜜黃調" onclick="setTheme('honey')"></button>
            <button class="theme-swatch" data-theme="forest" title="森林抹茶" aria-label="森林抹茶" onclick="setTheme('forest')"></button>
            <button class="theme-swatch" data-theme="ocean" title="海洋藍調" aria-label="海洋藍調" onclick="setTheme('ocean')"></button>
            <button class="theme-swatch" data-theme="lavender" title="薰衣草紫" aria-label="薰衣草紫" onclick="setTheme('lavender')"></button>
            <button class="theme-swatch" data-theme="berry" title="莓果粉紫" aria-label="莓果粉紫" onclick="setTheme('berry')"></button>
            <button class="theme-swatch" data-theme="cloud" title="雲朵奶霜" aria-label="雲朵奶霜" onclick="setTheme('cloud')"></button>
            <button class="theme-swatch" data-theme="charcoal" title="質感灰調" aria-label="質感灰調" onclick="setTheme('charcoal')"></button>
            <button class="theme-swatch" data-theme="night" title="夜幕黑調" aria-label="夜幕黑調" onclick="setTheme('night')"></button>
        </div>

        <section class="desktop-form card">
            <h2 id="formTitle">✨ 新增餐廳</h2>
            <form id="foodForm">
                <div class="input-group">
                    <label>店名 *</label>
                    <input id="name" type="text" placeholder="例如：大心拉麵">
                </div>
                <div class="input-group">
                    <label>類型</label>
                    <div class="select-wrap">
                        <select id="type" required>
                            <option value="" disabled selected hidden>請選擇類型</option>
                        </select>
                    </div>
                </div>
                <div class="input-group">
                    <label>評價</label>
                    <div class="select-wrap">
                        <select id="rating" required>
                            <option value="" disabled selected hidden>請選擇評價</option>
                            <option value="1">★☆☆☆☆</option>
                            <option value="2">★★☆☆☆</option>
                            <option value="3">★★★☆☆</option>
                            <option value="4">★★★★☆</option>
                            <option value="5">★★★★★</option>
                        </select>
                    </div>
                </div>
                <div class="input-group">
                    <label>地址</label>
                    <input id="address" type="text" placeholder="輸入地址">
                </div>
                <div class="input-group">
                    <label>相關網頁連結</label>
                    <input id="link" type="url" placeholder="輸入網頁網址 (https://...)">
                </div>
                <div class="input-group">
                    <label>美味備註</label>
                    <textarea id="note" placeholder="推薦料理、心得..."></textarea>
                </div>
                <button class="primary-btn" id="submitBtn" type="button" onclick="submitFood()">收藏餐廳</button>
                <button class="cancel-edit-btn" id="cancelEditBtn" type="button" onclick="cancelEdit()" style="display:none;">取消編輯</button>
            </form>
        </section>

        <!-- ====================== Food List ======================= -->
        <main id="foodContainer" class="food-grid">
            <div class="loading">
                正在載入美食收藏...
            </div>
        </main>

    </div>

    <!-- 手機版工具列：以圖示收納搜尋、收藏、地圖、色調和新增功能。 -->
    <nav class="mobile-tab-bar" aria-label="主要功能">
        <button type="button" class="mobile-tab-btn" onclick="toggleMobileSearch()" aria-label="搜尋" title="搜尋">
            <i class="bi bi-search" aria-hidden="true"></i>
        </button>
        <button type="button" id="mobileFavBtn" class="mobile-tab-btn" onclick="toggleFavFilter()" aria-label="我的最愛" title="我的最愛" aria-pressed="false">
            <i class="bi bi-star" aria-hidden="true"></i>
        </button>
        <button type="button" class="mobile-tab-btn mobile-tab-btn--add" onclick="openAddModal()" aria-label="新增餐廳" title="新增餐廳">
            <i class="bi bi-plus-lg" aria-hidden="true"></i>
        </button>
        <button type="button" id="mobileMapBtn" class="mobile-tab-btn" onclick="openMobileMap()" aria-label="地圖" title="店家定位中，請稍候..." disabled>
            <i class="bi bi-map" aria-hidden="true"></i>
        </button>
        <button type="button" id="mobileThemeBtn" class="mobile-tab-btn" onclick="toggleMobileThemePanel()" aria-label="切換風格" title="切換風格" aria-expanded="false">
            <i class="bi bi-palette" aria-hidden="true"></i>
        </button>
    </nav>

    <!-- ====================== Mobile Modal ======================= -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle"> 新增餐廳 </h2>
                <button onclick="closeModal()"> <i class="bi bi-x-lg"></i> </button>
            </div>
            <div class="mobile-form">
                <div class="input-group">
                    <label> 店名 * </label>
                    <input id="m-name" type="text" placeholder="餐廳名稱">
                </div>
                <div class="input-group">
                    <label> 類型 </label>
                    <div class="select-wrap">
                        <select id="m-type" required>
                            <option value="" disabled selected hidden>請選擇類型</option>
                        </select>
                    </div>
                </div>
                <div class="input-group">
                    <label> 評價 </label>
                    <div class="select-wrap">
                        <select id="m-rating" required>
                            <option value="" disabled selected hidden>請選擇評價</option>
                            <option value="1">★☆☆☆☆</option>
                            <option value="2">★★☆☆☆</option>
                            <option value="3">★★★☆☆</option>
                            <option value="4">★★★★☆</option>
                            <option value="5">★★★★★</option>
                        </select>
                    </div>
                </div>
                <div class="input-group">
                    <label> 地址 </label>
                    <input id="m-address" type="text">
                </div>
                <div class="input-group">
                    <label> 相關網頁連結 </label>
                    <input id="m-link" type="url" placeholder="https://...">
                </div>
                <div class="input-group">
                    <label> 備註 </label>
                    <textarea id="m-note"></textarea>
                </div>
                <button class="primary-btn" id="modalSubmitBtn" onclick="submitMobileFood()">
                    收藏
                </button>
                <button class="cancel-edit-btn" id="cancelEditBtnMobile" type="button" onclick="cancelEdit()" style="display:none;">
                    取消編輯
                </button>
            </div>
        </div>
    </div>

    <!-- ====================== 地圖檢視（全螢幕） ======================= -->
    <div id="mapView" class="map-view">
        <div class="map-view-header">
            <button class="map-back-btn" onclick="closeMapView()">← 返回列表</button>
            <div class="map-view-title"><i class="bi bi-map-fill"></i> 美食地圖 <span id="mapPinCount"></span></div>
        </div>
        <div id="mapCanvas" class="map-canvas"></div>
        <div id="mapLegend" class="map-legend"></div>
        <div id="mapLoading" class="map-loading"><i class="bi bi-geo-alt-fill"></i> 正在定位美食座標...</div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>
</body>
</html>
